<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>FTN Local — Workspace</title><link rel="stylesheet" href="/ftn-workspace.css"></head><body><main class="ftn-workspace-shell"><header class="ftn-toolbar"><div><div class="eyebrow">FTN Local</div><h1>Workspace</h1><div class="muted">Secure notes, encrypted files and owner-scoped folders</div></div><div class="ftn-toolbar-actions"><a class="btn green" href="/note-editor.html">+ New note</a><button id="newFolder" class="btn gray">+ Folder</button><button id="renameFolder" class="btn gray">Rename</button><button id="deleteFolder" class="btn gray">Delete</button><button id="refresh" class="btn gray">Refresh</button><a class="btn gray" href="/">Main console</a></div></header><section class="ftn-workspace-grid"><aside class="card ftn-tree-panel"><div class="file-toolbar"><h3 style="margin:0">File Browser</h3><span id="folderCount" class="small muted"></span></div><div id="tree" class="ftn-tree"><div class="muted small">Loading folders…</div></div></aside><section class="card ftn-files-panel"><div class="file-toolbar"><input id="search" class="field" placeholder="Search encrypted records"><select id="filter" class="field" style="max-width:170px"><option value="all">All items</option><option value="favorite">Favorites</option><option value="archived">Archived</option><option value="attachments">With attachments</option><option value="notes">Notes only</option></select><span id="count" class="small muted"></span></div><div id="status" class="small muted"></div><div id="files" class="file-list"></div></section><aside class="card ftn-inspector-panel"><h3>Inspector</h3><div id="inspector" class="muted small">Select an item to inspect metadata.</div><div id="actions" style="margin-top:12px"></div><hr><h3>Audit</h3><div id="audit" class="muted small">Workspace actions are recorded without plaintext, passphrases or decrypted file contents.</div></aside></section></main><script src="/ftn-workspace.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let folders=[],selected='root',notes=[],activeNote=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=s=>$('status').textContent=s;const toast=(message,ok=true)=>{status((ok?'✓ ':'✕ ')+message);clearTimeout(window.__ftnToast);window.__ftnToast=setTimeout(()=>status('Workspace synchronized'),3500)};
async function load(){try{status('Synchronizing workspace…');folders=await FTNWorkspace.listFolders();const r=await FTNWorkspace.api('/api/collections/notes/records?sort=-created&perPage=200');notes=r.items||[];$('folderCount').textContent=folders.length+' folder'+(folders.length===1?'':'s');renderTree();renderFiles();status('Workspace synchronized')}catch(e){toast(e.message,false)}}
function renderTree(){const root=FTNWorkspace.tree(folders);const out=[];function walk(n,depth=0){out.push('<button class="tree-item '+(selected===n.id?'active':'')+'" data-id="'+esc(n.id)+'" style="padding-left:'+(9+depth*18)+'px">'+(n.id==='root'?'▦':'▣')+' '+esc(n.name)+'</button>');(n.children||[]).forEach(x=>walk(x,depth+1))}walk(root);$('tree').innerHTML=out.join('');$('tree').querySelectorAll('.tree-item').forEach(b=>b.onclick=()=>{selected=b.dataset.id;activeNote=null;renderTree();renderFiles();clearInspector()})}
function matches(n){const q=$('search').value.trim().toLowerCase();if(q&&!JSON.stringify(n).toLowerCase().includes(q))return false;const f=$('filter').value;if(f==='favorite'&&!n.favorite)return false;if(f==='archived'&&!n.archived)return false;if(f==='attachments'&&!n.attachment)return false;if(f==='notes'&&n.attachment)return false;if(selected!=='root'&&n.folder!==selected)return false;return true}
function renderFiles(){const list=notes.filter(matches);$('count').textContent=list.length+' item'+(list.length===1?'':'s');$('files').innerHTML=list.map(n=>'<button class="file-row '+(activeNote===n.id?'active':'')+'" data-id="'+esc(n.id)+'"><div>'+(n.attachment?'▣':'▱')+'</div><div><div class="file-name">Encrypted note '+(n.favorite?'★':'')+(n.archived?' · Archived':'')+'</div><div class="file-meta">'+esc(n.id)+' · '+esc(new Date(n.created).toLocaleString())+'</div></div><div class="file-size">'+(n.attachment?'Attachment':'Note')+'</div></button>').join('')||'<div class="muted small">No records in this view.</div>';$('files').querySelectorAll('.file-row').forEach(b=>b.onclick=()=>inspect(notes.find(n=>n.id===b.dataset.id)))}
function clearInspector(){$('inspector').textContent='Select an item to inspect metadata.';$('actions').replaceChildren()}
function folderOptions(current){return '<option value="">Root</option>'+folders.map(f=>'<option value="'+esc(f.id)+'" '+(f.id===current?'selected':'')+'>'+esc(f.path)+'</option>').join('')}
function actionButton(label,fn,cls='gray'){const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=fn;return b}
function inspect(n){if(!n)return;activeNote=n.id;renderFiles();$('inspector').innerHTML='<div class="kpi"><span>Record</span><span>'+esc(n.id)+'</span></div><div class="kpi"><span>Created</span><span>'+esc(new Date(n.created).toLocaleString())+'</span></div><div class="kpi"><span>Updated</span><span>'+esc(new Date(n.updated||n.created).toLocaleString())+'</span></div><div class="kpi"><span>Type</span><span>'+esc(n.attachment?'Encrypted attachment':'Secure note')+'</span></div><div class="kpi"><span>Encryption</span><span>AES-GCM 256</span></div><div class="kpi"><span>Plaintext</span><span>Not stored</span></div><div class="kpi"><span>Folder</span><span>'+esc(folders.find(f=>f.id===n.folder)?.path||'Root')+'</span></div>';$('actions').replaceChildren();const open=document.createElement('a');open.className='btn green';open.href='/note-editor.html?id='+encodeURIComponent(n.id);open.textContent='Open secure note';$('actions').append(open);const move=document.createElement('select');move.className='field';move.style.marginTop='8px';move.innerHTML=folderOptions(n.folder);move.onchange=async()=>{try{const to=move.value;await FTNWorkspace.moveNote(n.id,to);await FTNWorkspace.audit('note.move','note',n.id,{from_folder:n.folder||'',to_folder:to});n.folder=to;toast('Note moved');renderFiles();inspect(n)}catch(e){move.value=n.folder||'';toast(e.message,false)}};$('actions').append(move);const fav=actionButton(n.favorite?'★ Unfavorite':'☆ Favorite',async()=>{try{await FTNWorkspace.toggleFavorite(n.id,n.favorite);await FTNWorkspace.audit(n.favorite?'note.unfavorite':'note.favorite','note',n.id);n.favorite=!n.favorite;toast(n.favorite?'Added to favorites':'Removed from favorites');renderFiles();inspect(n)}catch(e){toast(e.message,false)} });fav.style.marginTop='8px';$('actions').append(fav);const arch=actionButton(n.archived?'Unarchive':'Archive',async()=>{try{await FTNWorkspace.toggleArchived(n.id,n.archived);await FTNWorkspace.audit(n.archived?'note.unarchive':'note.archive','note',n.id);n.archived=!n.archived;toast(n.archived?'Note archived':'Note restored');renderFiles();inspect(n)}catch(e){toast(e.message,false)} });arch.style.marginTop='8px';$('actions').append(arch);if(n.attachment){const info=document.createElement('div');info.className='small muted';info.style.marginTop='8px';info.textContent='Encrypted attachment: preview/download from the secure note.';$('actions').append(info)}FTNWorkspace.audit('inspect','note',n.id);$('audit').textContent='Inspected '+n.id+' at '+new Date().toLocaleString()}
async function newFolder(){const name=prompt('New folder name');if(!name)return;try{await FTNWorkspace.createFolder(name,selected==='root'?'':selected);await FTNWorkspace.audit('folder.create','folder','',{parent:selected==='root'?'':selected});selected='root';await load()}catch(e){toast(e.message,false)}}
async function renameFolder(){if(selected==='root')return status('Select a folder first');const f=folders.find(x=>x.id===selected);if(!f)return;const name=prompt('Rename folder',f.name);if(!name||name===f.name)return;try{await FTNWorkspace.renameFolder(f.id,name);await FTNWorkspace.audit('folder.rename','folder',f.id,{old_path:f.path,new_name:name});await load()}catch(e){toast(e.message,false)}}
async function deleteFolder(){if(selected==='root')return status('Select a folder first');const f=folders.find(x=>x.id===selected);if(!f)return;if(!confirm('Delete empty folder '+f.name+'? Folders with subfolders or notes must be emptied first.'))return;try{await FTNWorkspace.deleteFolder(f.id);await FTNWorkspace.audit('folder.delete','folder',f.id,{path:f.path});selected='root';await load()}catch(e){toast(e.message,false)}}
$('search').oninput=renderFiles;$('filter').onchange=renderFiles;$('refresh').onclick=load;$('newFolder').onclick=newFolder;$('renameFolder').onclick=renameFolder;$('deleteFolder').onclick=deleteFolder;load()})();</script></body></html>
