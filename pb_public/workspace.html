<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTN Local Workspace</title><link rel="stylesheet" href="/ftn-workspace.css"></head><body><main class="ftn-workspace-shell"><header class="ftn-toolbar"><div><div class="eyebrow">FTN Local</div><h1>Workspace</h1><div class="muted">Folders, encrypted records and local audit activity</div></div><div class="ftn-toolbar-actions"><button id="newFolder" class="btn green">+ New folder</button><button id="refresh" class="btn gray">Refresh</button><a class="btn gray" href="/">Main console</a></div></header><section class="ftn-workspace-grid"><aside class="card ftn-tree-panel"><h3>File Browser</h3><div id="tree" class="ftn-tree"><div class="muted small">Loading folders…</div></div></aside><section class="card ftn-files-panel"><div class="file-toolbar"><input id="search" class="field" placeholder="Search encrypted records"><span id="count" class="small muted"></span></div><div id="status" class="small muted"></div><div id="files" class="file-list"></div></section><aside class="card ftn-inspector-panel"><h3>Inspector</h3><div id="inspector" class="muted small">Select an item to inspect metadata.</div><hr><h3>Audit</h3><div id="audit" class="muted small">Workspace actions are local PocketBase records only.</div></aside></section></main><script src="/ftn-workspace.js"></script><script src="/ftn-preview.js"></script><script src="/ftn-editor.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let folders=[],selected='root',notes=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('status').textContent=s}
async function load(){try{folders=await FTNWorkspace.listFolders();const r=await FTNWorkspace.api('/api/collections/notes/records?sort=-created&perPage=100');notes=r.items||[];renderTree();renderFiles();notify('Workspace synchronized');}catch(e){notify(e.message)}}
function renderTree(){const root=FTNWorkspace.tree(folders);const out=[];function walk(n,depth=0){out.push('<button class="tree-item '+(selected===n.id?'active':'')+'" data-id="'+esc(n.id)+'" style="padding-left:'+(9+depth*18)+'px">'+(n.id==='root'?'▦':'▣')+' '+esc(n.name)+'</button>');n.children.forEach(x=>walk(x,depth+1))}walk(root);$('tree').innerHTML=out.join('');$('tree').querySelectorAll('.tree-item').forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderTree();renderFiles()})}
function renderFiles(){const q=$('search').value.toLowerCase();let list=notes.filter(n=>JSON.stringify(n).toLowerCase().includes(q));if(selected!=='root'){const f=folders.find(x=>x.id===selected);list=list.filter(n=>n.folder===selected||n.folder_path===f?.path)}$('count').textContent=list.length+' item'+(list.length===1?'':'s');$('files').innerHTML=list.map(n=>'<button class="file-row" data-id="'+esc(n.id)+'"><div>▱</div><div><div class="file-name">Encrypted note</div><div class="file-meta">'+esc(n.id)+' · '+new Date(n.created).toLocaleString()+'</div></div><div class="file-size">'+(n.attachment?'Attachment':'Note')+'</div></button>').join('')||'<div class="muted small">No records in this view.</div>';$('files').querySelectorAll('.file-row').forEach(b=>b.onclick=()=>inspect(notes.find(n=>n.id===b.dataset.id)))}
function inspect(n){if(!n)return;$('inspector').innerHTML='<div class="kpi"><span>Record</span><span>'+esc(n.id)+'</span></div><div class="kpi"><span>Created</span><span>'+esc(new Date(n.created).toLocaleString())+'</span></div><div class="kpi"><span>Type</span><span>'+esc(n.attachment?'Encrypted attachment':'Secure note')+'</span></div><div class="kpi"><span>Encryption</span><span>AES-GCM</span></div><div class="kpi"><span>Plaintext</span><span>Not stored</span></div>';FTNWorkspace.audit('inspect','note',n.id);$('audit').textContent='Inspected '+n.id+' at '+new Date().toLocaleString()}
$('search').oninput=renderFiles;$('refresh').onclick=load;$('newFolder').onclick=async()=>{const name=prompt('Folder name');if(!name)return;try{await FTNWorkspace.createFolder(name,selected==='root'?'':(folders.find(x=>x.id===selected)?.path||''));await FTNWorkspace.audit('folder.create','folder','',{name});await load()}catch(e){notify(e.message)}};load()})();</script></body></html>
