<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>FTN Local — Secure Note</title><link rel="stylesheet" href="/ftn-workspace.css"></head><body><main class="ftn-workspace-shell"><header class="ftn-toolbar"><div><div class="eyebrow">FTN Local</div><h1 id="heading">Secure Note</h1><div class="muted">Encrypted in your browser before PocketBase persistence</div></div><div class="ftn-toolbar-actions"><a class="btn gray" href="/workspace.html">Workspace</a><a class="btn gray" href="/">Main console</a></div></header><section class="card" style="max-width:900px;margin:auto"><div class="file-toolbar"><input id="title" class="field" placeholder="Note title"><select id="folder" class="field"><option value="">All encrypted files</option></select><input id="tags" class="field" placeholder="Tags, comma separated"></div><div class="file-toolbar"><label class="small"><input id="favorite" type="checkbox"> Favorite</label><label class="small"><input id="archived" type="checkbox"> Archived</label></div><textarea id="body" class="field" style="width:100%;min-height:420px;resize:vertical" placeholder="Write your secure note…"></textarea><div class="file-toolbar"><input id="pass" class="field" type="password" autocomplete="off" placeholder="Encryption passphrase"><button id="save" class="btn green">Save encrypted note</button><button id="delete" class="btn gray" hidden>Delete</button><span id="status" class="small muted"></span></div></section></main><script src="/ftn-workspace.js"></script><script src="/ftn-note-editor.js"></script><script>
(()=>{const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),id=qs.get('id');let loaded=null;const status=s=>$('status').textContent=s;async function init(){try{const fs=await FTNWorkspace.listFolders();$('folder').insertAdjacentHTML('beforeend',fs.map(f=>'<option value="'+String(f.id).replace(/"/g,'&quot;')+'">'+String(f.path||f.name).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</option>').join(''));if(id){$('heading').textContent='Edit Secure Note';$('delete').hidden=false;status('Enter passphrase to decrypt');$('save').textContent='Save changes'}}catch(e){status(e.message)}}
$('save').onclick=async()=>{try{const p=$('pass').value;if(!p)throw Error('Passphrase required');if(!id&&loaded===null){}const n=await FTNNoteEditor.save(id,{title:$('title').value,body:$('body').value,pass:p,folder:$('folder').value,tags:$('tags').value,favorite:$('favorite').checked,archived:$('archived').checked});loaded=n;status('Encrypted and saved');location.href='/workspace.html'}catch(e){status(e.message)}};
$('delete').onclick=async()=>{if(!id||!confirm('Delete this secure note?'))return;try{await FTNNoteEditor.remove(id);location.href='/workspace.html'}catch(e){status(e.message)}};
async function load(){await init();if(!id)return;const p=prompt('Passphrase to decrypt this note');if(p===null)return;try{const n=await FTNNoteEditor.load(id,p);$('title').value=n.title;$('body').value=n.body;$('folder').value=n.folder||'';$('tags').value=n.tags||'';$('favorite').checked=n.favorite;$('archived').checked=n.archived;loaded=n;status('Decrypted locally; plaintext is held only in this page')}catch(e){status('Unable to decrypt note: '+e.message)}}load()})();</script></body></html>
