name: FTN Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compile
        run: python -m py_compile ai_service/app.py
      - name: Shell syntax
        run: bash -n FTN_PocketBase.sh
      - name: JavaScript syntax
        run: |
          node --check pb_public/ftn-note-editor.js
          node --check pb_public/ftn-workspace.js
          node --check pb_public/ftn-preview.js
          node --check pb_public/ftn-ux.js
          node --check pb_public/pwa.js
          node --check pb_public/sw.js
      - name: HTML inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['pb_public/index.html','pb_public/workspace.html','pb_public/note-editor.html']
          for path in files:
              s=Path(path).read_text()
              blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
              if not blocks:
                  raise SystemExit(f'no inline script block found: {path}')
              for i,block in enumerate(blocks):
                  out=Path(f'/tmp/ftn-inline-{i}.js')
                  out.write_text(block)
                  import subprocess
                  subprocess.run(['node','--check',str(out)],check=True)
          PY
      - name: FTN security regression checks
        run: python tests/ftn_security_check.py
      - name: PocketBase migration smoke test
        run: |
          curl -fsSL https://github.com/pocketbase/pocketbase/releases/download/v0.40.3/pocketbase_0.40.3_linux_amd64.zip -o /tmp/pb.zip
          unzip -q /tmp/pb.zip -d /tmp/pb
          mkdir -p /tmp/pbdata
          /tmp/pb/pocketbase migrate up --dir=/tmp/pbdata --migrationsDir="$GITHUB_WORKSPACE/pb_migrations"
          test -f /tmp/pbdata/data.db
